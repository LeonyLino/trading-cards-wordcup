<div class="login-container d-flex align-items-center justify-content-center">

  <div class="login-card shadow-lg">

    <div class="card-body">
      <h3 class="text-center mb-4">⚽ Login</h3>

      <form (ngSubmit)="login()" #form="ngForm">

        <div class="mb-3">
          <label>Email</label>
          <input 
            type="email" 
            class="form-control" 
            [(ngModel)]="email" 
            name="email" 
            required>
        </div>

        <div class="mb-3">
          <label>Senha</label>
          <input 
            type="password" 
            class="form-control" 
            [(ngModel)]="password" 
            name="password" 
            required>
        </div>

        <button class="btn btn-success w-100">
          Entrar
        </button>

      </form>
    </div>

  </div>

</div>

@if(loading){
<app-preloader-circular />
}
